# Decap CMS configuration — MyDNAPedia blog / events
# Hosting: GitHub Pages.  Auth: GitHub backend via the shared Wasabie
# Cloudflare Worker OAuth relay (the same one OASYS uses) — no per-site
# setup needed. Log in with a GitHub account that can write to this repo.

backend:
  name: github
  repo: Wasabie-studio/mydnapedia-landing-
  branch: main
  base_url: https://oasys-cms-oauth.wasabie-studioo.workers.dev
  auth_endpoint: auth

# Where uploaded images are stored in the repo, and how the site references them.
media_folder: "assets/blog"
public_folder: "/assets/blog"

# Editors see live previews of their edits disabled (static site, custom render).
show_preview_links: false

collections:
  - name: "blog"
    label: "Blog / Events"
    label_singular: "Event"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD MMM YYYY')}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - name: "category"
        label: "Category"
        widget: "select"
        default: "Launch"
        options: ["Launch", "Community", "Webinar", "Partnership", "Milestone"]
      - { name: "location", label: "Location (optional)", widget: "string", required: false, hint: "e.g. New Delhi, Online" }
      - { name: "image", label: "Cover image (optional)", widget: "image", required: false, hint: "Shown at the top of the event's article page and on its card. Leave empty to use the branded placeholder." }
      - { name: "excerpt", label: "Excerpt", widget: "text", hint: "1–2 sentences shown on the blog card (and used as the summary if there's no write-up below)." }
      - { name: "body", label: "Full write-up (optional)", widget: "markdown", required: false, hint: "The full text shown on the event's own article page (each card links to it)." }
