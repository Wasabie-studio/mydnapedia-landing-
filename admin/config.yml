# Decap CMS configuration — MyDNAPedia blog / events
# Hosting: GitHub Pages.  Auth: GitHub backend.
#
# ONE-TIME SETUP for login (see admin/CMS-SETUP.md):
#   GitHub Pages is static, so the "Login with GitHub" button needs a tiny
#   OAuth helper. Deploy the Cloudflare Worker in admin/oauth-worker.js
#   (free, ~10 min), then set `base_url` below to the worker's URL.

backend:
  name: github
  repo: Wasabie-studio/mydnapedia-landing-
  branch: main
  # base_url: https://<your-worker-url>   # <-- set after deploying the worker
  # auth_endpoint: auth

# Where uploaded images are stored in the repo, and how the site references them.
media_folder: "assets/blog"
public_folder: "/assets/blog"

# Editors see live previews of their edits disabled (static site, custom render).
show_preview_links: false

collections:
  - name: "blog"
    label: "Blog / Events"
    label_singular: "Event"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD MMM YYYY')}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - name: "category"
        label: "Category"
        widget: "select"
        default: "Launch"
        options: ["Launch", "Community", "Webinar", "Partnership", "Milestone"]
      - { name: "location", label: "Location (optional)", widget: "string", required: false, hint: "e.g. New Delhi, Online" }
      - { name: "image", label: "Cover image (optional)", widget: "image", required: false, hint: "Leave empty to use the branded placeholder." }
      - { name: "excerpt", label: "Excerpt", widget: "text", hint: "1–2 sentences shown on the card." }
      - { name: "body", label: "Full write-up (optional)", widget: "markdown", required: false }
